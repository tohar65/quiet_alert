<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Alert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Quiet Alert Status</h1>
        <div class="location-setter">
            <input type="text" id="location-input" list="approved-locations" placeholder="Enter location (e.g., 'פתח תקווה')">
            <datalist id="approved-locations"></datalist>
            <button id="check-alerts-btn" disabled>Check Alerts</button>
        </div>
        <div id="timer-container" style="display: none;"></div>
        <div id="alerts-container"></div>
        <div id="history-container"></div>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
