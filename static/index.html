<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Alert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quiet Alert Status</h1>
        <div class="location-setter">
            <input type="text" id="location-input" placeholder="Enter location (e.g., 'Tel Aviv')">
            <button id="set-location-btn">Check Alerts</button>
        </div>
        <div id="alert-status" class="alert-loading">
            Enter a location to begin.
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
