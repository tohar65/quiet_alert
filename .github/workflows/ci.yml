name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Security check with bandit
        run: |
          bandit -r oref_alert_parser web_app -x tests

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./oref_alert_parser
          pip install -r web_app/requirements.txt
          pip install pytest pytest-cov
      - name: Run Core Parser Tests
        run: pytest oref_alert_parser/tests
      - name: Run Web Server Unit Tests
        run: pytest web_app/tests/test_web_server.py web_app/tests/test_frontend_logic.py

  e2e-tests:
    needs: unit-tests
    # Run E2E tests on PRs to dev/main, or on push to dev/main
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./oref_alert_parser
          pip install -r web_app/requirements.txt
          pip install pytest playwright pytest-playwright
      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium
      - name: Run E2E Tests
        run: pytest web_app/tests/test_e2e_scenarios.py
